[package]
name = "wc-hostplat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host integration, the host's platform calls: audio endpoints and streams, opening, handlers, registration"

# THE PLATFORM HALF OF wc-hostint. wc-hostint decides (pure, tested anywhere);
# this crate makes the calls those decisions need on the host: WASAPI, the
# shell's association APIs, ShellExecuteW and the registry on Windows
# (`src/win`), CoreAudio and Launch Services on macOS (`src/mac`). The few
# helpers both share (the bounded PCM queue, the debounce, handler tokens,
# file URLs for the share) are pure and tested on the build machine.
[dependencies]
wc-hostint = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  # COM: CoInitializeEx, CoCreateInstance, CoTaskMemFree. The interfaces
  # themselves (IMMDeviceEnumerator, IAudioClient, IAssocHandler, ...) are
  # declared by hand in `win::com`, as shell.rs and the compositor do.
  "Win32_System_Com",
  # PropVariantClear, for the endpoints' friendly names.
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # CreateEventW / WaitForSingleObject: WASAPI's event-driven buffers.
  "Win32_System_Threading",
  # WAVEFORMATEX and the WASAPI constants.
  "Win32_Media_Audio",
  # ShellExecuteW, SHAssocEnumHandlers, AssocQueryStringW, AssocIsDangerous,
  # SHChangeNotify.
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # The per-user registration of Linux applications (HKCU only).
  "Win32_System_Registry",
] }

# §106, macOS: the microphone permission is asked through AVFoundation
# (`mac::mic`), never by opening an AudioQueue: a pending TCC dialog for an
# input queue holds every AudioQueue start in the process. The objc2 family
# the compositor already uses for AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[[bin]]
name = "wc-hostint-probe"
path = "src/bin/wc-hostint-probe.rs"

[[bin]]
name = "wc-portal-open"
path = "src/bin/wc-portal-open.rs"
