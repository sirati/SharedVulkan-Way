[package]
name = "wc-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A smithay compositor that stands up wl_display and xdg_shell as a Windows binary"

# lib + bin since the unification. The library is half of `sv-guest`, the
# binary is the Wayland-only executable that shipped before. one-binary.md §2.2.
[lib]
name = "wc_compositor"
path = "src/lib.rs"

[[bin]]
name = "wc-compositor"
path = "src/main.rs"

[dependencies]
# The feature set is the whole point of this crate existing separately from the
# vendored fork. `vendor/smithay` is deliberately NOT a workspace member: as a
# member, `cargo check --workspace` would build it with its own `default`
# features, which are DRM, GBM, libinput, libseat, X11, winit, XWayland and
# Vulkan — none of which exist on Windows and none of which we want on Linux
# either. Declaring the features here, at the one place that consumes smithay,
# keeps the fork's manifest identical to upstream's on that point and keeps the
# gate honest.
#
# `wayland_frontend` is the protocol implementations. `desktop` is the space and
# window management (4,768 lines, docs/waycompose-design.md §5.2).
smithay = { path = "../../vendor/smithay", default-features = false, features = [
  "wayland_frontend",
  "desktop",
] }
wayland-server = { workspace = true }
# STAGE 11. `protocols/wc-icon-v1.xml` is this project's own interface — icon
# pixels keyed by application id, for a resolver that is not the toplevel's
# client (see `src/icon.rs` for why that cannot be `xdg-toplevel-icon-v1`).
# The scanner generates the server half from the XML at compile time, and
# `wayland-backend` is named because the generated code refers to it; it is
# already in the tree as the transport fork, so this adds nothing to build.
wayland-scanner = { workspace = true }
wayland-backend = { workspace = true }
wc-transport = { workspace = true }
# §36: the Wayland byte stream rides shared_vulkan's rings, so the compositor
# accepts connections from the same control region the GPU half uses.
sv-transport = { workspace = true }
# §106: host integration (open links and files, per-device audio), served on a ring slot.
wc-hostint = { workspace = true }
# §93: pictures on the clipboard. Windows' applications read a copied image as
# `CF_DIB`, and Wayland's as `image/png`; this converts between the two. The
# same crate and version wc-proxy already decodes icons with.
png = "0.18"
sv-arena = { workspace = true }
sv-proto = { workspace = true }
# Unconditional as of stage 4, where it was `cfg(windows)` before. Two things
# moved it: `--arena` attaches regions on both platforms, and `map_counts()` is
# how a run says which of the three shared-memory mechanisms actually carried
# its pixels. Both are facts about the *boundary* rather than about Windows,
# and the Unix build of `wc-handle` exists precisely so that the shim is
# testable on the machine that builds it (see that crate's `platform/unix.rs`).
wc-handle = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Only for `dup2`, so `--log` means the same thing on both platforms. std has
# no safe way to point an existing file descriptor at a file.
libc = "0.2"
# §111.6/§111.10: `--boot-key broker:SOCK`, the record signed by the broker for
# the caller (the Linux server role's stand-in for the guest's service).
wc-broker = { workspace = true }

# §103.7: the AppKit platform. The objc2 family (MIT) enables every framework
# class by default; only the macOS build compiles any of it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# §106: the host's platform calls for host integration (endpoints, the shell opener, handlers).
wc-hostplat = { workspace = true }
# GROWTH. `SuperfetchPfnQuery`, which is how a region this process has just
# committed says *where its pages are* without the host having to search 13 GiB
# of backing object for stamps. ~330 ms of guest CPU whatever the window, and
# 0.064 s on the host afterwards, against 2832–3101 ms for the sweep — which is
# the difference between growing under load and stalling a video for three
# seconds. See `src/grow.rs`.
#
# `cfg(windows)` rather than unconditional because the crate depends on `ash`
# for a probe module this does not use, and a Linux build of `wc-compositor`
# (which is the one `cargo test` runs) has no PFN database to ask anyway.
awe-probe = { path = "../awe-probe" }
# The window half. Raw bindings rather than the `windows` crate for the reason
# in the workspace manifest: everything called here is a plain C entry point —
# `CreateWindowExW`, `SetDIBitsToDevice`, `GetMessageW` — with no COM and no
# WinRT, so the generated bindings cost nothing to compile.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # §105: the session's sound is played here (waveOut), from its ring.
  "Win32_Media",
  "Win32_Media_Audio",
  # §88: the frame clock lays its grid on DWM's vblank when there is one.
  "Win32_Graphics_Dwm",
  "Win32_System_Performance",
  "Win32_System_Console",
  # ADDED FOR STAGE 13: the clipboard. `DataExchange` is where the Windows
  # metadata files `OpenClipboard`, `SetClipboardData` and
  # `AddClipboardFormatListener` — not with the other window messages, which is
  # where one would look — and `Memory` is `GlobalAlloc`, because a clipboard
  # format is handed over as a moveable global handle and not as a pointer.
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  # ADDED FOR THE DRAG SOURCE. Windows' drag and drop is OLE, so this is the
  # first COM in the project: `FORMATETC` and `STGMEDIUM` are `Com` and
  # `Com_StructuredStorage`, `DoDragDrop` and `OleInitialize` are `Ole`. No
  # interface *definitions* come with them — `windows-sys` types every COM
  # pointer as `*mut c_void` — so the three vtables are written out in
  # `platform/drag.rs`, which is the honest shape of hand-rolled COM.
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  # ADDED FOR STAGE 8: the poll loop's wait is a high-resolution waitable timer
  # rather than `Sleep`, whose quantum on the guest is 15.6 ms (§13.8).
  # `Win32_Security` comes with it because `CreateWaitableTimerExW` takes a
  # pointer to `SECURITY_ATTRIBUTES`.
  "Win32_Security",
  "Win32_System_Threading",
  # ADDED FOR STAGE 6: `TrackMouseEvent` (without which there is no
  # `WM_MOUSELEAVE` at all), `SetCapture`/`ReleaseCapture` (without which a
  # drag off the window loses its release), and `GetKeyboardLayout` (which
  # chooses the keymap).
  # ADDED FOR §96: raw input (`RegisterRawInputDevices`, `GetRawInputData`),
  # which is how a locked pointer still reports the mouse's motion.
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  # ADDED FOR STAGE 20: `GetPointerType` and `GetPointerTouchInfo`, which are
  # the whole of the `wl_touch` source. The `WM_POINTER*` message numbers and
  # the `PT_*`/`TOUCH_MASK_*` constants are filed under WindowsAndMessaging
  # below, so this feature is only the two entry points and
  # `POINTER_TOUCH_INFO`.
  "Win32_UI_Input_Pointer",
  "Win32_UI_WindowsAndMessaging",
  # ADDED FOR STAGE 21: `SetThreadExecutionState`, which is
  # `zwp_idle_inhibit_manager_v1`'s whole implementation. It is filed under
  # Power rather than with the window APIs because it is a property of the
  # calling thread rather than of a window — see `win32::set_idle_inhibit`.
  "Win32_System_Power",
  # ADDED FOR STAGE 32: the taskbar identity, which is the one place in this
  # tree where the "no COM" note above stops holding. `SHGetPropertyStoreForWindow`
  # hands back an `IPropertyStore`, and there is no flat entry point that sets a
  # property on an `HWND`. windows-sys generates no interfaces, so the vtable is
  # declared by hand in `win32.rs`; what these two features bring is the entry
  # point, `CoInitializeEx`/`CoTaskMemFree`, and `PROPERTYKEY`.
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com",
] }
