[package]
name = "wc-handle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Typed replacement for a Wayland `h` argument on platforms without SCM_RIGHTS"

[target.'cfg(windows)'.dependencies]
# `Win32_Storage_FileSystem` is `CreateFileW`/`DeleteFileW`, which arrived with
# `Descriptor::SharedFile` in stage 4. It was missing from this list until stage
# 5 and the crate still built, because `wc-compositor` enables the same feature
# and cargo unifies features across a workspace build. `cargo build -p wc-handle
# --target x86_64-pc-windows-gnu` on its own did not, which is the form nobody
# was running. Declaring what you use is the fix; the lesson is that a workspace
# build is not a check that a crate's manifest is complete.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  # STAGE 7. `GetCurrentProcess`, `GetProcessWorkingSetSize` and
  # `SetProcessWorkingSetSize` — the working-set quota `VirtualLock` is charged
  # against when a guest-RAM arena is pinned. Added here rather than relying on
  # a sibling crate enabling it, which is §10.10's lesson applied on the first
  # occasion it could have been repeated.
  "Win32_System_Threading",
  # DYNAMIC ARENA. `K32GetProcessMemoryInfo` — the working set, which is the
  # evidence that releasing a region actually returned the pages. See
  # `arena::committed_bytes`.
  "Win32_System_ProcessStatus",
  # IVSHMEM ARENA. `SetupDiGetClassDevsW` and friends to find the device by its
  # interface GUID, and `DeviceIoControl` to ask its driver for the mapping.
  # See `platform::windows::map_ivshmem`.
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
# ONE ARENA, ONE DEFINITION OF WHAT A PAGE IS.
#
# `GIFT_GRANULARITY` used to be a local `4096` whose doc comment said it matched
# `sv_arena::GRANULARITY` — a constant copied across a repository boundary
# because it could not be reached across one. It can now.
#
# This is a *shared primitive* dependency and it is deliberately unconditional:
# `sv-arena` cross-compiles clean for `x86_64-pc-windows-gnu` (measured,
# one-binary.md §1.3), and `wc-handle` is in the guest binary, which is a
# Windows binary. A `cfg(unix)` gate here would mean the Windows build kept its
# own copy of the number, which is the thing being deleted.
sv-arena = { workspace = true }
# GROWTH. The control region and the rings the growth channel rides on.
# Nothing in `src/grow.rs` extends them: `SharedRegion::from_raw` already
# exists for the guest-RAM case and its own doc comment names it, and
# `Control`/`Ring` are used exactly as `sv-gpu-server` and `sv-icd` use them.
# Waycompose is an addition to shared_vulkan rather than a second system
# beside it, so a growth request is a message on that channel.
sv-transport = { workspace = true }
# The boot record's authenticator (macboot.rs, waycompose-design.md §105):
# HMAC-SHA-256 under the installation's key. Already in the lockfile.
sha2 = "0.10"
