[package]
name = "sv-arena"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The passthrough arena: extents, slabs, the 4096-granularity allocator, the R26 canary"

[dependencies]
# For the slab directory in the control region and the shared mapping the arena
# is carved from. The allocator itself touches neither: design.md §5.2 keeps it
# entirely in the app side's private memory.
sv-transport = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The stamped page record, for the Linux guest-side provider. Shared with
# `sv-hostd`, `arena-host` and `awe-probe` rather than re-typed: the whole value
# of the locator is that a match means the two sides really are looking at the
# same page, and two layouts that agree on the magic and differ on a field
# offset would turn a genuine result into a confusing one.
arena-record = { path = "../arena-record" }
