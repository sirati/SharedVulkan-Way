[package]
name = "sv-gpu-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The shared_vulkan GPU side: ring consumers, the object table, SlabImport, and a real Vulkan driver behind them"

[dependencies]
sv-proto.workspace = true
sv-wire.workspace = true
sv-transport.workspace = true
# §108: the pool grows from guest RAM.
sv-ram = { path = "../sv-ram" }
# Pass 12: the generated wire → C raise pass, the driver's function table, and
# the forwarding `Server` impl that covers 221 of the 239 commands.
sv-gpu-entry.workspace = true
sv-arena.workspace = true
# The reference implementation of the workload's transform, and the page-record
# layout. Shared with `gpu-probe` rather than re-typed, so the shader, the GPU
# side and the app side cannot drift — which is the whole reason the check is
# informative.
arena-record = { path = "../arena-record" }
# `loaded` rather than `linked`: the GPU side dlopens the loader at run time,
# which is what lets one binary run against lavapipe in a container and against
# a real driver on the metal without a rebuild. `vk-probe` and `gpu-probe`
# already make the same choice.
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }

# `sv-dmabuf-e2e` reads the dma-buf token it is handed (waycompose-design.md §104).
[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc.workspace = true
wc-hyperlinux = { path = "../wc-hyperlinux" }
sv-drm.workspace = true

# The Windows guest-RAM provider, for the cross-VM topology. `awe-probe` owns
# the four Win32 allocators `docs/measured-gpu-side.md` measured and the
# `SVARENA1` stamp `sv-hostd`'s locator sweeps for. Depending on it here rather
# than re-typing `VirtualAlloc`/`VirtualLock` is the same argument that crate's
# own header makes: a second implementation would put the measurement at risk
# for no gain, and the two would drift.
[target.'cfg(windows)'.dependencies]
awe-probe = { path = "../awe-probe" }
# The ivshmem device: finding it by slot and asking its driver for the BAR
# mapping (waycompose-design.md §87). The compositor's arena moved onto such a
# device in §83 and the code that talks to the driver lives in `wc-handle`;
# the GPU sessions' arena is the second device, and a second copy of that FFI
# would be the drift `awe-probe`'s comment above warns about.
wc-handle = { path = "../wc-handle" }
# §111.8: the GPU device and the svbell port, lent by the broker.
wc-broker = { workspace = true }

# macOS (waycompose-design.md §103.6): the session's extent is guest RAM pinned
# by `wc_handle::arena::alloc_guest_ram_window`, superpages or wired pages, the
# allocator §103.3 measured for the compositor's arena.
[target.'cfg(target_os = "macos")'.dependencies]
wc-handle = { path = "../wc-handle" }

[dev-dependencies]
# Only so the two sides' shared constants can be *compared* rather than each
# asserted against a literal. Neither side may depend on the other at run time —
# they are separate processes and, on `testhost`, separate operating systems —
# but a test binary can link both and check they agree.
sv-icd = { path = "../sv-icd" }
sv-hostd = { path = "../sv-hostd" }
