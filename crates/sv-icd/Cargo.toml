[package]
name = "sv-icd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The shared_vulkan app side: a Vulkan ICD the real loader can enumerate"

[lib]
# `cdylib` for the loader to `dlopen`, `rlib` so the tests can drive the same
# code in-process without going through the loader at all.
crate-type = ["cdylib", "rlib"]

[dependencies]
sv-icd-entry.workspace = true
sv-proto.workspace = true
sv-wire.workspace = true
sv-transport.workspace = true
sv-arena.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The dma-buf token (waycompose-design.md §104): a sealed memfd, Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
sv-drm.workspace = true
# waycompose-design.md §111.10: `SV_BELL=broker:sv-hub`, the hub through the broker.
wc-broker.workspace = true
