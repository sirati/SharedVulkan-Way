[package]
name = "wc-launch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Double-click a Windows shortcut and a Linux application appears, over the guest's own RAM"

# NO DEPENDENCIES ON LINUX, AND TWO WIN32 FEATURES ON WINDOWS.
#
# The parts worth testing -- the configuration, the command lines that come out
# of it, and the .ico wrapper -- are portable and are tested by `cargo test` on
# the machine that builds this, which is not the machine that runs it. What is
# left for Windows is a named mutex and `CreateProcess`, and std does the second
# one.
[dependencies]
# §103.8: the icon of a macOS bundle is resampled to an exact .icns size. The
# version the compositor already uses for the clipboard and icons.
png = "0.18"
# §106: host integration. The decisions (path map, registry plan, MIME table)
# and the host's platform calls (registry, file URLs for the share).
wc-hostint = { workspace = true }
wc-hostplat = { workspace = true }

# §103.8: on macOS the launcher runs the compositor in its own process, so the
# application's windows and its Dock tile are one process's.
[target.'cfg(target_os = "macos")'.dependencies]
wc-compositor = { path = "../wc-compositor" }
# §103.14: the session's control and sound channels are ring slots.
sv-transport = { workspace = true }
# §103.15: the boot record's GPU label.
wc-handle = { workspace = true }
# §111.9: the LaunchDaemon holds the session's windows, lends the doorbell
# ports and signs the boot record.
wc-broker = { workspace = true }

[target.'cfg(windows)'.dependencies]
# §105: the compositor's control socket, which carries this launcher's
# requests to the host's session over the rings; AF_UNIX, as the Wayland one.
wc-transport = { workspace = true }
windows-sys = { workspace = true, features = [
  # CloseHandle, GetLastError, ERROR_ALREADY_EXISTS.
  "Win32_Foundation",
  # `CreateMutexW` takes a pointer to SECURITY_ATTRIBUTES, so its binding is
  # behind this feature even though the pointer passed is always null.
  "Win32_Security",
  # CreateMutexW / OpenMutexW: the liveness test. docs/waycompose-design.md §19.4 --
  # a process that holds a named mutex is alive by construction, which an image
  # name is not (§16.8) and which a probe of the compositor's own socket must
  # not be (§17.4: the first client releases the held keymap).
  "Win32_System_Threading",
  # §82: `LoadLibraryW` and `GetProcAddress`, for the DPI entry points that
  # size Firefox's tab strip to Windows' caption. Resolved, not linked.
  "Win32_System_LibraryLoader",
  # §86: waveOut, which plays the session's sound. The oldest audio API is
  # the right size here: one fixed PCM format, a bounded queue, no callbacks.
  "Win32_Media",
  "Win32_Media_Audio",
  # §92. The shell: shortcuts that carry the application's identity
  # (`IShellLinkW`, `IPropertyStore`), its jump list (`ICustomDestinationList`),
  # the Start menu and desktop folders, the UI language for the tasks' names,
  # and the taskbar's theme for their glyphs. See `src/shell.rs`.
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Win32_System_Registry",
  # §102.14. A single application's window: find it (`EnumWindows`, its
  # identity through `SHGetPropertyStoreForWindow`), bring it to the front, and
  # tell the user in a `MessageBoxW` when a launch fails.
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell_PropertiesSystem",
] }
