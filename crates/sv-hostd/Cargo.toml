[package]
name = "sv-hostd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "App-side daemon: owns the extent's descriptor, hands the fd and the view geometry to ICD processes"

[dependencies]
sv-transport = { workspace = true }
sv-arena = { workspace = true }
sv-wire = { workspace = true }
sv-proto = { workspace = true }
# §105.14: the ivshmem header, which names the rings the hub rings directly.
wc-handle = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1"
# The stamped page record, defined once and shared with the guest half. design.md
# §12 calls `arena-record` "the stamped page record, defined **once** so a match
# cannot be an artefact of the two sides disagreeing about a field offset" — and
# `Mode::Qemu` is precisely the configuration where the two sides are different
# programs on different operating systems, so a second copy of these offsets is
# the one thing that must not exist.
arena-record = { path = "../arena-record" }
# The render node's relay (waycompose-design.md §112): registering the ICD
# socket's and the doorbell hub's services, and taking the forwarded clients.
sv-drm = { workspace = true }
# Stitching a scattered extent into one contiguous view is `mmap(MAP_FIXED)` per
# run, which has no safe spelling.
libc = { workspace = true }
# waycompose-design.md §111.10: the GPU BAR (`--region broker:ID`) and the
# doorbell hub (`--cold-bell broker:sv-hub`) through the broker.
wc-broker = { workspace = true }

# Unactivated protected original-page adapter, never the legacy whole-BAR client path.
sv-ram = { path = "../sv-ram" }

[features]
# Explicit disposable native harness only; never enabled by daemon startup.
protected-payload-fixture = []

[[example]]
name = "protected_qmp_flow"
required-features = ["protected-payload-fixture"]
