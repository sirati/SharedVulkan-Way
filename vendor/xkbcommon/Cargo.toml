# Fork of xkbcommon 0.8.0 (rust-x-bindings/xkbcommon-rs). See vendor/PATCHES.md.
#
# Two deviations from upstream's manifest, both mechanical:
#
#   * `memmap2` is now a Unix-only dependency. It exists solely for
#     `Keymap::new_from_fd`, which this fork gates to `cfg(unix)` because its
#     signature takes an `OwnedFd`. Keeping it unconditional would make a
#     Windows build carry a memory-mapping crate it can never call.
#
#   * The `quick-evdev` example and its `evdev` dev-dependency are dropped.
#     `evdev` is a Linux uapi binding and does not build for Windows at all, so
#     with it present `cargo check --workspace --all-targets` cannot be clean —
#     and that gate is the one this project actually enforces. Nothing in the
#     library depends on the example.
[package]
name = "xkbcommon"
version = "0.8.0"
authors = ["Remi THEBAULT <remi.thebault@gmail.com>"]
description = "Rust bindings and wrappers for libxkbcommon"
repository = "https://github.com/rust-x-bindings/xkbcommon-rs"
readme = "README.md"
keywords = ["keyboard", "x11", "wayland", "xcb", "input"]
license = "MIT"
edition = "2021"

[package.metadata.docs.rs]
all-features = true

[dependencies]
libc = "0.2.148"
as-raw-xcb-connection = { version = "1.0", optional = true }
xkeysym = "0.2.0"

[target.'cfg(unix)'.dependencies]
memmap2 = { version = "0.9.0", optional = true }

[features]
default = ["wayland"]
x11 = ["as-raw-xcb-connection"]
wayland = ["memmap2"]
