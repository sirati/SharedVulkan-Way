# §102 (docs/waycompose-design.md): the guest's block for
# scripts/wc-linux-desktop-apps.ini, appended to wc-launch.ini by
# `WC_LAUNCH_EXTRA_APP_BLOCKS=...` at deploy.
[app.linux-desktop]
title    = Windows 7 (Linux)
icon     = atp-nested
host-app = linux-desktop
desktop  = atp-nested
# Both windows say `atp-nested` (through wc-proxy, §102.4), so the shortcut, the
# pin and the windows are one taskbar button.
app-id   = atp-nested
# One window at most (§102.14): a click while it is up brings it to the front,
# a click while it is starting waits for it, and the host is asked once.
single   = on
[app.linux-desktop-win11]
title    = Windows 11 (Linux)
icon     = atp-nested-win11
host-app = linux-desktop-win11
desktop  = atp-nested-win11
app-id   = atp-nested-win11
single   = on
