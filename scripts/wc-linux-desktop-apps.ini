# §102 (docs/waycompose-design.md): <desktop-user>'s future Linux desktop as one window
# on the guest, for a VM host's apps.ini, appended by
# `WC_LAUNCH_EXTRA_APPS=scripts/wc-linux-desktop-apps.ini scripts/wc-launch.sh deploy`
# (with scripts/wc-linux-desktop-apps-guest.ini as WC_LAUNCH_EXTRA_APP_BLOCKS).
#
# `atp-nested` is nix-config's win7-desktop module (testhost/linux-desktop.nix
# turns it on): the login screen on a seat of its own, then the chosen session,
# AeroThemePlasma or Windows 11-style Plasma, as a nested KWin. `guest` hides
# the login screen's "Start Windows" and ends the seat with the session.
#
# Its two windows (the login screen's cosmic-comp, then the session's KWin)
# belong to the users cosmic-greeter and <desktop-user>, whose environment wc-proxy
# cannot read, so `atp-nested` names them by uid in the session directory
# (wc-foreign-app-ids, §102.4); WC_APP_ID here is the name it writes.
#
# 1280x800 is the size of the login screen's window (smithay's winit default, which
# cosmic-comp does not change), so the session's window replaces it at the same
# size. KWin's output follows the window when
# it is resized or maximised. No GPU: KWin's Wayland backend composites with
# QPainter on a host without a render node (§102.3), and its clients run on
# llvmpipe.
[linux-desktop]
exec     = /run/current-system/sw/bin/atp-nested
args     = login 1280x800 guest
titlebar = none
desktop  = atp-nested
gpu      = off
env      = WC_APP_ID=atp-nested
