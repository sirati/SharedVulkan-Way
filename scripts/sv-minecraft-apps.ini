# §96 (docs/minecraft.md): Minecraft's applications for a VM host's apps.ini,
# appended by `WC_LAUNCH_EXTRA_APPS=scripts/sv-minecraft-apps.ini
# scripts/wc-launch.sh deploy`. ~/wc-mc is what
# `scripts/sv-minecraft.sh ship` puts there: Prism's data, the recorded
# launches, bin/minecraft-demo and the desktop entries and icon in share/.
#
# Minecraft 1.21.11 in Mojang's demo mode, started as Prism Launcher started
# it; `args` picks the renderer. gpu.env applies: Zink on the guest's GPU for
# the stock game, and our ICD for VulkanMod's Vulkan.
[minecraft]
exec     = ~/wc-mc/bin/minecraft-demo
args     = stock
titlebar = none
desktop  = wc-minecraft
gpu      = on

[minecraft-vulkanmod]
exec     = ~/wc-mc/bin/minecraft-demo
args     = vulkanmod
titlebar = none
desktop  = wc-minecraft-vulkanmod
gpu      = on

# Prism Launcher itself, on the same data, with both instances. Without an
# account its Play is Mojang's demo, three dialogs (docs/minecraft.md); it offers
# a Microsoft login, which is the person's to use or not. The game it starts
# inherits this session's Wayland display, sound and GPU environment, and its
# wrapper (bin/minecraft-prism-wrap, Prism's global setting) gives the game's
# window the shortcut's identity and Minecraft's icon (§96.11).
#
# Qt on Wayland, never X11, and no frame of Qt's own: the compositor gives the
# window Windows' caption (`titlebar = none`, §82).
[prism]
exec     = /nix/store/3hksy22mgw8ij6x5mqzayxn2cisg2pqn-prismlauncher-11.1.1/bin/prismlauncher
args     = -d ~/wc-mc/prism
titlebar = none
desktop  = org.prismlauncher.PrismLauncher
gpu      = on
env      = QT_QPA_PLATFORM=wayland
env      = QT_WAYLAND_DISABLE_WINDOWDECORATION=1
