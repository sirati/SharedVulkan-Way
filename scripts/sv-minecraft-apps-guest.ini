# §96 (docs/minecraft.md): the guest's blocks for scripts/sv-minecraft-apps.ini,
# appended to wc-launch.ini by `WC_LAUNCH_EXTRA_APP_BLOCKS=...` at deploy.
[app.minecraft]
title    = Minecraft Demo (Linux)
icon     = wc-minecraft
host-app = minecraft
desktop  = wc-minecraft

[app.minecraft-vulkanmod]
title    = Minecraft Demo VulkanMod (Linux)
icon     = wc-minecraft
host-app = minecraft-vulkanmod
desktop  = wc-minecraft-vulkanmod

[app.prism]
title    = Prism Launcher (Linux)
icon     = org.prismlauncher.PrismLauncher
host-app = prism
desktop  = org.prismlauncher.PrismLauncher
